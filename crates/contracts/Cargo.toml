[package]
name = "todo-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
ts-rs = "12.0.1"

[dev-dependencies]
# Only the tests need a concrete format: the wire shape (camelCase keys,
# omitted optionals, unknown fields refused) is part of the contract and is
# asserted against real JSON rather than inferred from the attributes.
serde_json = "1"
