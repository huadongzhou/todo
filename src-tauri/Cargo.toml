[package]
name = "cross-platform-todo"
version = "0.1.0"
description = "A cross-platform todo application"
authors = ["Todo Team"]
edition = "2021"
rust-version.workspace = true

[lib]
name = "cross_platform_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
log = "0.4"
rusqlite = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.11.1", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2.4.3"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
ts-rs = "12.0.1"
todo-contracts = { path = "../crates/contracts" }
todo-domain = { path = "../crates/domain" }
